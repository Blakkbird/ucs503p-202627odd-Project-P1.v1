[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pawan"
version = "0.4.0"
description = "Locally calibrated next-day PM2.5 forecasting for Patiala"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Gurkirpa Singh", email = "gsarao_be24@thapar.edu" },
  { name = "Ketubh Bansal" },
  { name = "Aayush Kandhol" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
]
# The forecast is standard library only, on purpose: the daily job
# runs unattended and nothing in its path should be able to break on
# a dependency upgrade. See requirements.txt. The model lab's
# benchmarks are an optional extra.
dependencies = []

[project.optional-dependencies]
lab = ["scikit-learn==1.8.0", "numpy==2.4.4", "scipy==1.17.1"]
api = ["fastapi==0.163.1", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.urls]
Homepage = "https://blakkbird.github.io/ucs503p-202627odd-Project-P1.v1"
Repository = "https://github.com/Blakkbird/ucs503p-202627odd-Project-P1.v1"

# Adapted from https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "code"
]
