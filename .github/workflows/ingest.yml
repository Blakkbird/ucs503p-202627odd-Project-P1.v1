name: Daily ingest

on:
  schedule:
    - cron: "30 2 * * *"     # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      # master is protected and requires a pull request, and the
      # default GITHUB_TOKEN is not on the ruleset bypass list.
      # Checking out with a PAT makes the later push authenticate
      # as a repository admin, which is on the list.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch today's records
        id: fetch
        # run_daily.py now exits non-zero when the observation
        # record has gone stale, and it does that after writing
        # whatever it did manage to fetch. Letting the step fail
        # here would skip the commit and throw those rows away, so
        # the failure is deferred to the last step instead.
        continue-on-error: true
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python code/ingest/run_daily.py

      - name: Validate what was written
        run: |
          pip install pytest
          python -m pytest code/tests/ -q

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing to commit; data already current."
            exit 0
          fi
          git commit -m "data: ingest $(date -u +%F)"
          git push

      # Today's rows are committed by now, so it is safe to go red.
      - name: Report a bad ingest
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::run_daily.py exited non-zero -- see the"\
               "Fetch step log for which source failed."
          exit 1
