name: Daily ingest

on:
  schedule:
    - cron: "30 2 * * *"     # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch today's records
        env:
          OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python code/ingest/run_daily.py

      - name: Validate what was written
        run: |
          pip install pytest
          python -m pytest code/tests/ -q

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing to commit; data already current."
            exit 0
          fi
          git commit -m "data: ingest $(date -u +%F)"
          git push
