name: mkdocs 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The revision-date and authors plugins read git history;
          # a shallow clone gives every page the same date.
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 14331962+bvraghav@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # The pinned list in requirements-docs.txt, the same one a
      # local build uses. This used to be a longer list typed out
      # here, including numpy, pandas and scikit-learn, which the
      # site never imports.
      - run: pip install -r requirements-docs.txt
      - run: PYTHONPATH=src:$PYTHONPATH mkdocs gh-deploy --force
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
