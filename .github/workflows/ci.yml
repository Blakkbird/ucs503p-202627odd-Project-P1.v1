name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # The lab's and the API's requirements too, so their tests
        # run here; the daily forecast never imports either.
        run: pip install -r requirements.txt -r requirements-lab.txt -r requirements-api.txt

      - name: Lint
        run: ruff check code/ scripts/

      - name: Test
        run: python -m pytest code/tests/ -q
