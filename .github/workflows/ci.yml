name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # The lab's requirements too, so its scikit-learn tests run
        # here; the daily forecast never imports them.
        run: pip install -r requirements.txt -r requirements-lab.txt

      - name: Lint
        run: ruff check code/ scripts/

      - name: Test
        run: python -m pytest code/tests/ -q
